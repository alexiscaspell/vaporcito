linters-settings:
  maligned:
    suggest-new: true

linters:
  enable-all: true
  disable:
    - goimports
    - depguard
    - lll
    - gochecknoinits
    - gochecknoglobals
    - gofmt
    - scopelint
    - gocyclo
    - funlen
    - wsl
    - gocognit
    - godox

service:
  golangci-lint-version: 1.21.x
  prepare:
    - rm -f back/go.sum # 1.12 -> 1.13 issues with QUIC-go
    - cd back && GO111MODULE=on go mod vendor
    - cd back && go run build.go assets
