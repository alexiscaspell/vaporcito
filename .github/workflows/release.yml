name: Build and Release

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      base: ${{ steps.version.outputs.base }}
      bump: ${{ steps.version.outputs.bump }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      next_stable: ${{ steps.version.outputs.next_stable }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect channel
        id: channel
        run: |
          case "${GITHUB_REF_NAME}" in
            main) echo "name=main" >> "$GITHUB_OUTPUT" ;;
            develop) echo "name=develop" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Calculate SemVer
        id: version
        run: |
          chmod +x scripts/calc-version.sh
          ./scripts/calc-version.sh --channel "${{ steps.channel.outputs.name }}"

      - name: Skip if tag already exists
        id: skip
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  cli:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: back/go.mod
          cache-dependency-path: back/go.sum

      - name: Build CLI Linux + Windows
        working-directory: back
        env:
          CGO_ENABLED: "0"
        run: |
          VER="v${{ needs.version.outputs.version }}"
          mkdir -p ../dist/cli
          go run build.go -goos linux -goarch amd64 -no-upgrade -version "$VER" build
          mv vaporcito ../dist/cli/vaporcito-linux-amd64
          chmod +x ../dist/cli/vaporcito-linux-amd64
          go run build.go -goos windows -goarch amd64 -no-upgrade -version "$VER" build
          mv vaporcito.exe ../dist/cli/vaporcito-windows-amd64.exe
          (cd ../dist/cli && sha256sum vaporcito-linux-amd64 vaporcito-windows-amd64.exe > SHA256SUMS.txt)

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/cli/*
          if-no-files-found: error

  desktop-linux:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux WebView / bundler deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf pkg-config libdbus-1-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: back/go.mod
          cache-dependency-path: back/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri desktop (Linux)
        working-directory: front/desktop
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUNDLE_VERSION: ${{ needs.version.outputs.next_stable }}
          FORCE_REBUILD: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-linux.sh

      - name: Collect Linux desktop artifacts
        run: |
          mkdir -p dist/desktop-linux
          # Prefer AppImage + deb; fall back to any bundle files.
          find front/desktop/src-tauri/target/release/bundle -type f \( \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
          \) -exec cp -v {} dist/desktop-linux/ \;
          ls -la dist/desktop-linux
          test "$(find dist/desktop-linux -type f | wc -l)" -gt 0

      - name: Upload Linux desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/desktop-linux/*
          if-no-files-found: error

  desktop-windows:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: back/go.mod
          cache-dependency-path: back/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/desktop/package-lock.json

      - name: Set up Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri desktop (Windows)
        working-directory: front/desktop
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUNDLE_VERSION: ${{ needs.version.outputs.next_stable }}
          FORCE_REBUILD: "1"
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-windows.sh

      - name: Collect Windows desktop artifacts
        shell: bash
        run: |
          mkdir -p dist/desktop-windows
          find front/desktop/src-tauri/target/release/bundle -type f \( \
            -name '*.msi' -o -name '*.exe' -o -name '*.nsis.zip' \
          \) -exec cp -v {} dist/desktop-windows/ \;
          # Avoid shipping unsigned helper exes from nsis folders if empty; require at least one file.
          ls -la dist/desktop-windows
          test "$(find dist/desktop-windows -type f | wc -l)" -gt 0

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/desktop-windows/*
          if-no-files-found: error

  release:
    needs: [version, cli, desktop-linux, desktop-windows]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp -v artifacts/cli-binaries/* dist/ || true
          cp -v artifacts/desktop-linux/* dist/ || true
          cp -v artifacts/desktop-windows/* dist/ || true
          # Refresh checksums for everything in dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lah dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Vaporcito ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            **SemVer:** `${{ needs.version.outputs.version }}`
            **Canal:** `${{ needs.version.outputs.channel }}`
            **Bump:** `${{ needs.version.outputs.bump }}` (desde `${{ needs.version.outputs.base }}`)
            **Próxima estable:** `${{ needs.version.outputs.next_stable }}`

            ### Desktop (Tauri)
            Instaladores nativos (ventana WebView + sidecar Go, sin navegador del sistema):
            - Linux: `.AppImage` / `.deb`
            - Windows: `.msi` / `.exe` (NSIS)

            ### CLI
            - `vaporcito-linux-amd64`
            - `vaporcito-windows-amd64.exe`
          files: dist/*
