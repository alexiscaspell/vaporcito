[package]
name = "vaporcito-desktop"
version = "0.1.0"
description = "Desktop shell for Vaporcito"
authors = ["Vaporcito"]
edition = "2021"

[lib]
name = "vaporcito_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
